<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weight Tracker Demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
  html, body { margin: 0; background: #f4f5f7; font-family: Roboto, "Segoe UI", sans-serif; }
  body.dark { background: #111; }
  #wrap { max-width: 520px; margin: 0 auto; }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
window.addEventListener("error", (e) => (document.getElementById("wrap").textContent += "ERROR: " + e.message + " line " + e.lineno + "\n"));
window.addEventListener("unhandledrejection", (e) => (document.getElementById("wrap").textContent += "ERROR: " + (e.reason && e.reason.stack || e.reason) + "\n"));
// Preview the card with made-up data, no Home Assistant needed:
//   python -m http.server 8765   then open http://localhost:8765/demo/index.html  (#trends, #health, #settings, ?dark)
customElements.define("ha-icon", class extends HTMLElement {
  connectedCallback() { const i = (this.getAttribute("icon") || "").replace("mdi:", ""); this.innerHTML = `<i class="mdi mdi-${i}" style="font-size:20px;line-height:1"></i>`; }
});
const iso = (d) => d.toISOString().slice(0, 10);
const DEMO_TODAY = iso(new Date());
const ago = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); };
const per = (kcal, protein, carbs, fat, sat_fat, fiber, sugar, sodium_mg, chol_mg) => ({ kcal, protein, carbs, fat, sat_fat, fiber, sugar, sodium_mg, chol_mg });
const DEMO_FOODS = {
  oats: { id: "usda:1", name: "Oats, rolled, dry", brand: "", per100: per(379, 13.2, 67.7, 6.5, 1.1, 10.1, 1, 6, 0), portions: [{ label: "1/2 cup (40 g)", g: 40 }], unit: "g", generic: true },
  banana: { id: "usda:2", name: "Banana, raw", brand: "", per100: per(89, 1.1, 22.8, 0.3, 0.1, 2.6, 12.2, 1, 0), portions: [{ label: "1 medium (118 g)", g: 118 }], unit: "g", generic: true },
  yogurt: { id: "off:3", name: "Greek Yogurt, Plain Nonfat", brand: "Sample Dairy", per100: per(59, 10.3, 3.6, 0.4, 0.1, 0, 3.2, 36, 5), portions: [{ label: "1 cup (227 g)", g: 227 }], unit: "g" },
  chicken: { id: "usda:4", name: "Chicken breast, roasted", brand: "", per100: per(165, 31, 0, 3.6, 1, 0, 0, 74, 85), portions: [{ label: "4 oz (113 g)", g: 113 }], unit: "g", generic: true },
  rice: { id: "usda:5", name: "Rice, brown, cooked", brand: "", per100: per(123, 2.7, 25.6, 1, 0.3, 1.6, 0.2, 4, 0), portions: [{ label: "1 cup (195 g)", g: 195 }], unit: "g", generic: true },
  salad: { id: "off:6", name: "Garden Salad Kit", brand: "Sample Greens", per100: per(120, 2, 9, 9, 1.5, 2, 4, 240, 5), portions: [{ label: "1 1/2 cups (85 g)", g: 85 }], unit: "g" },
  salmon: { id: "usda:7", name: "Salmon, Atlantic, baked", brand: "", per100: per(206, 22, 0, 12.4, 2.5, 0, 0, 61, 63), portions: [{ label: "1 fillet (154 g)", g: 154 }], unit: "g", generic: true },
  broccoli: { id: "usda:8", name: "Broccoli, steamed", brand: "", per100: per(35, 2.4, 7.2, 0.4, 0.1, 3.3, 1.4, 41, 0), portions: [{ label: "1 cup (156 g)", g: 156 }], unit: "g", generic: true },
  almonds: { id: "off:9", name: "Roasted Almonds", brand: "Sample Snacks", per100: per(607, 21.4, 21.4, 53.6, 3.6, 10.7, 3.6, 0, 0), portions: [{ label: "1 oz (28 g)", g: 28 }], unit: "g" },
};
let nextId = 1;
const entry = (meal, f, g, hour) => {
  const F = DEMO_FOODS[f], e = { id: nextId++, meal, ts: `${DEMO_TODAY}T${String(hour).padStart(2, "0")}:15:00`, food_id: F.id, name: F.name, brand: F.brand, amount: 1, portion_label: F.portions[0].label, portion_g: g, grams: g, per100: F.per100 };
  for (const k in F.per100) e[k] = F.per100[k] == null ? null : Math.round(F.per100[k] * g) / 100;
  return e;
};
const DEMO_ENTRIES = [entry("breakfast", "oats", 40, 7), entry("breakfast", "banana", 118, 7), entry("breakfast", "yogurt", 227, 7),
  entry("lunch", "chicken", 113, 12), entry("lunch", "rice", 195, 12), entry("lunch", "salad", 85, 12),
  entry("dinner", "salmon", 154, 18), entry("dinner", "broccoli", 156, 18), entry("snacks", "almonds", 28, 15)];
const NUT_KEYS = ["kcal", "protein", "carbs", "fat", "sat_fat", "fiber", "sugar", "sodium_mg", "chol_mg"];
const totals = {}; NUT_KEYS.forEach((k) => (totals[k] = Math.round(DEMO_ENTRIES.reduce((s, e) => s + (e[k] || 0), 0) * 10) / 10));
const meal_kcal = {}; ["breakfast", "lunch", "dinner", "snacks"].forEach((m) => (meal_kcal[m] = Math.round(DEMO_ENTRIES.filter((e) => e.meal === m).reduce((s, e) => s + e.kcal, 0))));
const DEMO_SETTINGS = { units: "lb", start_weight: 192, start_date: ago(60), goal_weight: 175, height_in: 69, daily_kcal: 1900,
  goals: { protein: 140, carbs: 200, fat: 65, fiber: 30, sugar: 50, sodium_mg: 2300, sat_fat: 20, chol_mg: 300 }, water_goal_oz: 64,
  notify_target: "both", notify_service: "mobile_app_phone", over_goal_alert: true,
  reminders: { breakfast: { enabled: true, time: "10:00" }, lunch: { enabled: true, time: "14:00" }, dinner: { enabled: true, time: "20:00" },
    weigh_in: { enabled: true, time: "09:00" }, water: { enabled: false, time: "15:00" }, summary: { enabled: true, time: "21:30" } } };
// 90 days of made-up history: weight trending from 192 down to 184.6
const DEMO_WEIGHTS = [], DEMO_BP = [], DEMO_DAYS = [], DEMO_WATER = [], MEAL_ROWS = [];
for (let i = 89; i >= 0; i--) {
  const d = ago(i), w = Math.round((184.6 + i * 0.085 + Math.sin(i * 1.7) * 0.6) * 10) / 10;
  if (i % 2 === 0 || i < 10) DEMO_WEIGHTS.push({ id: 1000 + i, day: d, ts: `${d}T07:05:00`, weight: i === 0 ? 184.6 : w, body_fat: null, source: i % 3 ? "apple_health" : "manual" });
  if (i % 4 === 0) DEMO_BP.push({ id: 2000 + i, day: d, ts: `${d}T07:10:00`, systolic: 118 + Math.round(Math.sin(i) * 6), diastolic: 76 + Math.round(Math.cos(i) * 4), pulse: 64 + (i % 7), source: "apple_health", note: null });
  if (i > 0) {
    const k = Math.round(1750 + Math.sin(i * 2.3) * 260 + (i % 6 === 0 ? 350 : 0));
    DEMO_DAYS.push({ day: d, kcal: k, protein: Math.round(k * 0.07), carbs: Math.round(k * 0.11), fat: Math.round(k * 0.035), sat_fat: 12, fiber: 26, sugar: 38, sodium_mg: 2050, chol_mg: 180, n: 8 });
    DEMO_WATER.push({ day: d, oz: 40 + (i % 5) * 8 });
    [["breakfast", 0.25], ["lunch", 0.33], ["dinner", 0.33], ["snacks", 0.09]].forEach(([m, f]) => MEAL_ROWS.push({ day: d, meal: m, kcal: Math.round(k * f) }));
  }
}
DEMO_DAYS.push({ day: DEMO_TODAY, ...totals, n: DEMO_ENTRIES.length }); DEMO_WATER.push({ day: DEMO_TODAY, oz: 40 });
const DEMO_NOTES = [{ id: 1, day: ago(1), ts: `${ago(1)}T20:30:00`, text: "Walked 3 miles after dinner.", tag: null }, { id: 2, day: ago(4), ts: `${ago(4)}T21:00:00`, text: "Dinner out, estimated portions.", tag: null }];
const latestBp = DEMO_BP[DEMO_BP.length - 1];
const DEMO_SUMMARY = { date: DEMO_TODAY, settings: DEMO_SETTINGS, totals, meal_kcal, water_oz: 40, entries: DEMO_ENTRIES.length, weight: 184.6, weight_ts: `${DEMO_TODAY}T07:05:00`, body_fat: null,
  weight_change_7d: -0.8, start_weight: 192, goal_weight: 175, to_goal: 9.6, lost: 7.4, bmi: 27.3, bp: latestBp, kcal_avg_7d: 1812, has_weight_today: true };
const inRange = (rows, s, e) => rows.filter((r) => r.day >= s && r.day <= e);
const hass = {
  themes: { darkMode: location.search.includes("dark") }, language: "en", states: {}, user: { name: "Demo" },
  connection: { subscribeMessage: async () => () => {} },
  callService: async () => {},
  callWS: async (m) => {
    const t = m.type.replace("weight_tracker/", "");
    switch (t) {
      case "day": return { date: m.date || DEMO_TODAY, entries: (m.date || DEMO_TODAY) === DEMO_TODAY ? DEMO_ENTRIES : [], totals, meal_kcal,
        water: [{ id: 1, ts: `${DEMO_TODAY}T09:00:00`, oz: 16 }, { id: 2, ts: `${DEMO_TODAY}T13:00:00`, oz: 24 }], water_oz: 40,
        weights: [DEMO_WEIGHTS[DEMO_WEIGHTS.length - 1]], bp: [], notes: [], today: DEMO_TODAY, settings: DEMO_SETTINGS, summary: DEMO_SUMMARY, alerts: [] };
      case "range": return { start: m.start, end: m.end, days: inRange(DEMO_DAYS, m.start, m.end), meals: inRange(MEAL_ROWS, m.start, m.end), water: inRange(DEMO_WATER, m.start, m.end),
        weights: inRange(DEMO_WEIGHTS, m.start, m.end), bp: inRange(DEMO_BP, m.start, m.end), notes: inRange(DEMO_NOTES, m.start, m.end) };
      case "settings/get": return { settings: DEMO_SETTINGS, webhook_url: "https://your-home.example/api/webhook/xxxxxxxx", notify_services: ["mobile_app_phone"],
        food_db_url: "http://192.168.1.50:8080", food_db: { ok: true, counts: { off: 1129851, usda: 1876636 }, meta: {} } };
      case "history": return { rows: (m.kind === "weights" ? DEMO_WEIGHTS : m.kind === "bp" ? DEMO_BP : DEMO_NOTES).slice().reverse().slice(0, m.limit || 60) };
      case "food/recent": return { products: Object.values(DEMO_FOODS) };
      case "food/search": return { products: Object.values(DEMO_FOODS).filter((f) => f.name.toLowerCase().includes((m.q || "").toLowerCase())), food_db_ok: true };
      default: return { ok: true };
    }
  },
};
const s = document.createElement("script");
s.src = "../www/weight-tracker-card.js";
s.onload = () => {
  if (hass.themes.darkMode) document.body.classList.add("dark");
  const el = document.createElement("weight-tracker-card"); el.setConfig({}); el.hass = hass;
  document.getElementById("wrap").appendChild(el);
};
document.head.appendChild(s);
</script>
</body>
</html>
